services:
  # 階層型 KV キャッシュ計測用の llama-server。
  #
  # deploy/pd/ の PD分離用サーバとはポートも KV 保存先も分ける。
  # イメージは deploy/pd/ でビルド済みの llama-pd:b10679 を流用する。
  #
  # PD分離との違いは以下の 3 フラグ。これが L2 (host DRAM) tier を有効にする。
  #   --cache-ram N        : prompt cache の上限 (MiB)。VRAM から溢れた KV の退避先
  #   --cache-idle-slots   : 新規タスク到着時に idle slot を prompt cache へ退避する
  #   --kv-unified         : これがないと prompt cache が黙って無効化される
  llama-kvtier:
    image: llama-pd:${LLAMA_TAG:-b10679}
    container_name: llama-kvtier
    restart: "no"
    gpus: all
    # KV ファイルを host ユーザ所有で書かせる。
    # root 所有だと mincore() が page cache の実状態を隠す (Linux 5.0 の
    # CVE-2019-5489 対策: 書き込み権限のないファイルは常に「常駐」と報告する)。
    # Case D の検証が成立しなくなるため必須。
    user: "${KVT_UID:-1000}:${KVT_GID:-1000}"
    ports:
      - "${KVT_SERVER_PORT:-18090}:18090"
    volumes:
      - ${MODEL_DIR:?MODEL_DIR を .env に設定してください}:/models:ro
      - ./kv:/kv
    command: >
      -m /models/${MODEL_FILE:-Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      --host 0.0.0.0 --port 18090
      -c ${KVT_N_CTX:-49152} -np 1 -ngl 99 -fa on
      --cache-type-k ${KVT_KV_TYPE:-q8_0} --cache-type-v ${KVT_KV_TYPE:-q8_0}
      --slots --slot-save-path /kv/
      --cache-ram ${KVT_CACHE_RAM:-8192} --kv-unified --cache-idle-slots
      --no-context-shift --no-warmup -lv 5
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/18090'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
